name: Build MadenRadar
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Add LiteLDev xmake repo
        run: xrepo add-repo liteldev-remote https://github.com/LiteLDev/xmake-repo.git

      - name: Configure
        run: xmake f -p android -a arm64-v8a -m release --ndk=${{ steps.setup-ndk.outputs.ndk-path }} -y

      - name: Build
        run: xmake -y

      - name: Package levipack
        run: |
          SO=$(find build -name "libMadenRadar.so" | head -1)
          cp "$SO" .
          zip MadenRadar_v2.levipack manifest.json icon.png libMadenRadar.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadenRadar_v2
          path: MadenRadar_v2.levipack
          if-no-files-found: error
